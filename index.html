<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Hailemanas Academy Dashboard</title>

<style>

/* ===== BODY ===== */
body{
  background-color: black;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  margin: 0;
}

/* ===== HEADER ===== */
header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 30px;
  background-color: #111; /* small contrast */
}

header h1{
  margin: 0;
}

nav button{
  background-color: gray;
  color: white;
  border: none;
  padding: 8px 14px;
  margin-left: 8px;
  cursor: pointer;
}

nav button:hover{
  background-color: darkgray;
}

/* ===== MAIN ===== */
main{
  padding: 20px 30px;
}

/* ===== CARDS ===== */
.card{
  background-color: #111;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 6px;
}

/* ===== GRID ===== */
.grid{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

/* ===== BUTTONS ===== */
button{
  cursor: pointer;
}

.green-btn{
  background-color: green;
  color: white;
  border: none;
  padding: 8px 12px;
}

.red-btn{
  background-color: crimson;
  color: white;
  border: none;
  padding: 8px 12px;
}

/* ===== ADMIN BUTTON ===== */
#admin-btn{
  position: fixed;
  bottom: 15px;
  left: 15px;
  background-color: red;
  color: white;
  border: none;
  padding: 10px 14px;
}

/* ===== MODAL ===== */
#admin-modal{
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.8);
  display: none;
  justify-content: center;
  align-items: center;
}

.modal-box{
  background-color: #111;
  padding: 20px;
  width: 400px;
}

input, textarea{
  width: 100%;
  padding: 8px;
  margin-top: 8px;
  background-color: black;
  color: white;
  border: 1px solid gray;
}

</style>
</head>

<body>

<!-- ===== HEADER ===== -->
<header>

  <h1>Hailemanas Academy</h1>

  <nav>
    <button onclick="showSection('home')">Dashboard</button>
    <button onclick="showSection('announcements')">Announcements</button>
    <button onclick="showSection('notes')">Notes</button>
  </nav>

</header>

<!-- ===== ADMIN BUTTON ===== -->
<button id="admin-btn">Admin</button>

<!-- ===== MAIN ===== -->
<main>

  <!-- HOME -->
  <section id="home" class="card">
    <h2>Welcome Students</h2>
    <p>This is the school dashboard.</p>

    <div class="grid">

      <div class="card">
        <h3>Latest Announcement</h3>
        <p id="latest-ann">None</p>
      </div>

      <div class="card">
        <h3>Notes</h3>
        <p id="notes-count">0 files</p>
      </div>

      <div class="card">
        <h3>Info</h3>
        <p>Admin login bottom left.</p>
      </div>

    </div>
  </section>

  <!-- ANNOUNCEMENTS -->
  <section id="announcements" class="card" style="display:none;">
    <h2>Announcements</h2>
    <div id="ann-list"></div>
  </section>

  <!-- NOTES -->
  <section id="notes" class="card" style="display:none;">
    <h2>Notes</h2>
    <div id="notes-list"></div>
  </section>

</main>

<!-- ===== ADMIN MODAL ===== -->
<div id="admin-modal">
  <div class="modal-box">

    <h3>Admin Panel</h3>

    <input id="ann-text" placeholder="Announcement title">
    <textarea id="ann-desc" placeholder="Description"></textarea>

    <button class="green-btn" onclick="addAnnouncement()">Add</button>
    <button class="red-btn" onclick="clearAnnouncements()">Clear</button>

  </div>
</div>

<!-- ===== SCRIPT ===== -->
<script>

const ADMIN_PASSWORD = "hmahma";

let announcements = [];
let notes = [];

/* ===== NAVIGATION ===== */
function showSection(id){
  document.querySelectorAll("main section").forEach(sec=>{
    sec.style.display = "none";
  });
  document.getElementById(id).style.display = "block";
}

/* ===== ADMIN LOGIN ===== */
document.getElementById("admin-btn").onclick = ()=>{
  let pass = prompt("Enter admin password:");
  if(pass === ADMIN_PASSWORD){
    document.getElementById("admin-modal").style.display = "flex";
  }else{
    alert("Wrong password");
  }
};

/* ===== ANNOUNCEMENTS ===== */
function addAnnouncement(){
  let title = document.getElementById("ann-text").value;
  let desc = document.getElementById("ann-desc").value;

  if(title === "") return alert("Write title");

  announcements.push({title, desc});
  renderAnnouncements();
}

function clearAnnouncements(){
  announcements = [];
  renderAnnouncements();
}

function renderAnnouncements(){
  let list = document.getElementById("ann-list");
  list.innerHTML = "";

  announcements.forEach(a=>{
    let div = document.createElement("div");
    div.className = "card";
    div.innerHTML = "<b>"+a.title+"</b><p>"+a.desc+"</p>";
    list.appendChild(div);
  });

  document.getElementById("latest-ann").textContent =
    announcements.length ? announcements[announcements.length-1].title : "None";
}

/* ===== INIT ===== */
renderAnnouncements();

</script>

</body>
</html>
