<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Hailemanas Academy Dashboard</title>

<style>
body{
  background-color: black;
  color: white;
  overflow-x: hidden;
  font-family: Arial, Helvetica, sans-serif;
  margin: 0;
}

/* ===== HEADER ===== */
header{
  max-width: 1000px;
  margin: 0 auto;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1{
  font-size: 2em;
  font-weight: bold;
  margin: 0;
}

header p{
  color: lightgray;
  font-size: 0.9em;
}

/* ===== NAV BUTTONS ===== */
nav button{
  padding: 8px 12px;
  border-radius: 5px;
  background-color: gray;
  color: white;
  border: none;
  cursor: pointer;
  margin-left: 5px;
}

nav button:hover{
  background-color: darkgray;
}

/* ===== MAIN CONTENT ===== */
main{
  max-width: 1000px;
  margin: 0 auto;
  padding: 20px;
}

/* ===== CARDS ===== */
.card-3d{
  background-color: #111;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 8px;
  border: 1px solid gray;
}

/* ===== ADMIN BUTTON ===== */
#admin-btn{
  background-color: red;
  color: white;
  padding: 8px 12px;
  border: none;
  border-radius: 5px;
}

/* ===== ADMIN MODAL ===== */
#admin-modal{
  background-color: rgba(0,0,0,0.8);
  display: flex;
  justify-content: center;
  align-items: center;
}

#admin-modal .card-3d{
  background-color: #111;
  border: 1px solid gray;
  padding: 15px;
}

/* ===== INPUTS ===== */
input, select, textarea{
  background-color: black;
  color: white;
  border: 1px solid gray;
  border-radius: 5px;
  padding: 6px 8px;
}

/* ===== BUTTONS ===== */
button{
  cursor: pointer;
}

.bg-emerald-500{
  background-color: green;
  color: black;
}

.bg-rose-500{
  background-color: crimson;
  color: white;
}

/* ===== SMALL TEXT ===== */
.text-slate-300{
  color: lightgray;
}

.text-slate-400{
  color: silver;
}

.text-white{
  color: white;
}

.text-black{
  color: black;
}
</style>
</head>

<body>

<!-- ===== HEADER ===== -->
<header>
  <h1>Hailemanas Academy</h1>
  <nav>
    <button onclick="showSection('home')">Dashboard</button>
    <button onclick="showSection('announcements')">Announcements</button>
  </nav>
</header>

<!-- ===== ADMIN BUTTON ===== -->
<button id="admin-btn">Admin</button>

<!-- ===== MAIN ===== -->
<main>

  <!-- HOME -->
  <section id="home" class="card-3d">
    <h2>Welcome Students</h2>
    <p>This is the school dashboard.</p>

    <div class="card-3d">
      <h3>Latest Announcement</h3>
      <p id="latest-ann">No announcements yet.</p>
    </div>

    <div class="card-3d">
      <h3>Info</h3>
      <p>Admin login bottom left. Contact: admissions@hmacademy.org</p>
    </div>
  </section>

  <!-- ANNOUNCEMENTS -->
  <section id="announcements" class="card-3d" style="display:none;">
    <h2>Announcements</h2>
    <div id="ann-list"></div>
  </section>

</main>

<!-- ===== ADMIN MODAL ===== -->
<div id="admin-modal">
  <div class="card-3d">

    <h3>Admin Panel</h3>

    <input id="ann-text" placeholder="Announcement title">
    <textarea id="ann-desc" placeholder="Description"></textarea>

    <button class="bg-emerald-500" onclick="addAnnouncement()">Add</button>
    <button class="bg-rose-500" onclick="clearAnnouncements()">Clear</button>

  </div>
</div>

<!-- ===== SCRIPT ===== -->
<script>
const ADMIN_PASSWORD = "hmahma";

let announcements = [];

/* ===== NAVIGATION ===== */
function showSection(id){
  document.querySelectorAll("main section").forEach(sec=>{
    sec.style.display = "none";
  });
  document.getElementById(id).style.display = "block";
}

/* ===== ADMIN LOGIN ===== */
document.getElementById("admin-btn").onclick = ()=>{
  let pass = prompt("Enter admin password:");
  if(pass === ADMIN_PASSWORD){
    document.getElementById("admin-modal").style.display = "flex";
  }else{
    alert("Wrong password");
  }
};

/* ===== ANNOUNCEMENTS ===== */
function addAnnouncement(){
  let title = document.getElementById("ann-text").value;
  let desc = document.getElementById("ann-desc").value;

  if(title === "") return alert("Write title");

  announcements.push({title, desc});
  renderAnnouncements();
}

function clearAnnouncements(){
  announcements = [];
  renderAnnouncements();
}

function renderAnnouncements(){
  let list = document.getElementById("ann-list");
  list.innerHTML = "";

  announcements.forEach(a=>{
    let div = document.createElement("div");
    div.className = "card-3d";
    div.innerHTML = "<b>"+a.title+"</b><p>"+a.desc+"</p>";
    list.appendChild(div);
  });

  document.getElementById("latest-ann").textContent =
    announcements.length ? announcements[announcements.length-1].title : "No announcements yet.";
}

/* ===== INIT ===== */
renderAnnouncements();

</script>

</body>
</html>
